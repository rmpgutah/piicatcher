[tool.poetry]
name = "piicatcher-web-api"
version = "0.1.0"
description = "FastAPI backend that embeds piicatcher and serves the web UI."
authors = ["rmpgutah"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
# Same Python ceiling as the piicatcher dep chain (dbcat caps <=3.10.8).
python = ">=3.9,<=3.10.8"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
pydantic = "^2.9"
piicatcher = "^0.21.2"
# pin python-multipart so the file-upload endpoint stays compatible.
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7"
httpx = "^0.27"  # for TestClient

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
