[tool.poetry]
name = "piicatcher"
version = "0.22.0"
description = "Find PII data in databases"
authors = ["Tokern <info@tokern.io>"]
license = "Apache 2.0"
classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Topic :: Database",
        "Topic :: Software Development",
        "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords=["pii","postgres","snowflake","redshift","athena","bigquery"]
readme="README.md"
homepage="https://tokern.io/"
repository="https://github.com/tokern/piicatcher/"


# NOTE on Python version range:
# Upstream `dbcat` (the catalog substrate this project depends on) pins
# `python >=3.8,<=3.10.8` and `SQLAlchemy <1.4`. Until dbcat is modernized
# or replaced, piicatcher cannot move past Python 3.10. See MIGRATION.md.
[tool.poetry.dependencies]
python = ">=3.9,<=3.10.8"
pyyaml = "^6.0"
click = "^8.1"
python-json-logger = "^3.2"
commonregex-improved = "^1.0.2"
dbcat = "^0.15.0"
typer = "^0.4.0"  # gated by dbcat <0.5
goog-stats = "^0.1.2"
tabulate = "^0.9.0"
sqlalchemy-bigquery = "1.6.1"  # gated by SQLAlchemy 1.3 pin in dbcat
google-cloud-bigquery-storage = "^2.20"
great-expectations = {version = "^0.13.42", optional = true}
acryl-datahub = {version = "^0.8.16", optional = true}
tqdm = "^4.67"
catalogue = "^2.0.10"

[tool.poetry.extras]
datahub = ["acryl-datahub", "great-expectations"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.7"
mypy = "^1.13"
pre-commit = "^3.5"
pytest = "^7.4"  # pytest 8 dropped some plugin compat used by pytest-cases here
coverage = "^7.6"
pytest-cov = "^5.0"
twine = "^5.1"
pytest-mock = "^3.14"
types-PyMySQL = "^1.1"
types-python-dateutil = "^2.9"
types-PyYAML = "^6.0"
pytest-cases = "^3.8"
types-tabulate = "^0.9"
pytest-order = "^1.3"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
piicatcher = "piicatcher.command_line:app"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Matches the rules the legacy flake8 config (setup.cfg) was actually enforcing:
#   E/W: pycodestyle, F: pyflakes
# `B` (flake8-bugbear), `I` (isort), and `UP` (pyupgrade) are intentionally NOT
# selected here — enabling them surfaces 30+ pre-existing latent issues
# (unused-loop-control-variable, function-call-in-default-argument, missing
# `raise ... from`, etc.) that are out of scope for the 0.22.0 modernization.
# A follow-up PR can opt in to those families and fix them.
select = ["E", "W", "F"]
# Preserved ignores from the legacy flake8 config:
#   E203 — whitespace before ':' (conflicts with Black-style slices)
#   E501 — line too long (handled by formatter, not lint)
ignore = ["E203", "E501"]

[tool.mypy]
files = ["piicatcher", "tests"]
ignore_missing_imports = true
