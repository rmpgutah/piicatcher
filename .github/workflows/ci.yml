# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: piicatcher
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Python is capped at 3.10.8 by the upstream `dbcat` dependency.
        # 3.8 is dropped (EOL Oct 2024).
        python-version: ['3.9', '3.10.8']
    name: Python ${{ matrix.python-version }}
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: piiuser
          POSTGRES_PASSWORD: p11secret
          POSTGRES_DB: piidb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_USER: piiuser
          MYSQL_PASSWORD: p11secret
          MYSQL_DATABASE: piidb
          MYSQL_ROOT_PASSWORD: r00tpassw0rd
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python Poetry
      uses: abatilo/actions-poetry@v3
      with:
        poetry-version: 1.8.3
    - name: View poetry version
      run: poetry --version
    - name: Install dependencies
      run: poetry install
    - name: Lint with ruff
      run: poetry run ruff check piicatcher tests
    - name: Test with pytest
      run: |
        poetry run pytest --pg-host localhost --mysql-host localhost \
          --junitxml=junit/test-results.xml \
          --cov=piicatcher --cov-report=xml --cov-report=html tests/
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
